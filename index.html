    .catch(e=>toast('Delete failed: '+e.message));
}

/* ============================ Match page ============================ */
let SCORER = {}; // matchId -> true once unlocked this session
let localBowler = {}; // matchId -> chosen bowler for pending over

function renderMatch(id){
  app.innerHTML=`<div class="muted">Loading match…</div>`;
  unsub = COL().doc(id).onSnapshot(doc=>{
    if(!doc.exists){ app.innerHTML='<div class="card">Match not found. <a onclick="go(\'#/\')">Home</a></div>'; return; }
    const m=doc.data();
    drawMatch(m);
  }, err=>{ app.innerHTML='<div class="card">Error: '+esc(err.message)+'</div>'; });
}

function drawMatch(m){
  const canScore = SCORER[m.id];
  if(m.status==='setup' || (m.innings.length<=m.currentInnings)){
    return canScore ? drawInningsSetup(m) : drawWaiting(m);
  }
  const inn=m.innings[m.currentInnings];
  const s=derive(m,inn);
  const header = scoreboardHTML(m,inn,s);

  if(m.status==='done'){ return drawSummary(m); }

  // innings complete but match not done -> break screen
  if(s.complete){
    if(canScore) return drawInningsBreak(m,inn,s,header);
    return app.innerHTML = header + `<div class="card center"><b>Innings complete.</b><br><span class="muted">Waiting for scorer…</span><br><button class="btn blue sm" style="margin-top:10px" onclick="unlock('${m.id}')">✍️ Score this match</button></div>` + historyLink(m);
  }

  // live
  if(!canScore){
    app.innerHTML = header + scorecardHTML(m,inn,s) +
      `<div class="card center"><button class="btn blue sm" onclick="unlock('${m.id}')">✍️ Score this match</button></div>` + historyLink(m);
    return;
  }
  // scorer, live
  app.innerHTML = header + scoringControls(m,inn,s) + scorecardHTML(m,inn,s);
}

function historyLink(m){
  const back = (m&&m.seasonId)? `#/season/${m.seasonId}` : '#/';
  const label = (m&&m.seasonId)? '← Back to season' : '← Home';
  return `<div class="center small" style="margin-top:14px"><a onclick="go('${back}')">${esc(label)}</a></div>`;
}

function scoreboardHTML(m,inn,s){
  const battingName=m.teams[inn.batting].name;
  const isSecond = m.innings && m.innings[1] === inn;
  let chase='';
  if(isSecond && m.innings[0]){
    const first=derive(m,m.innings[0]);
    const target=first.total+1, need=target-s.total, ballsLeft=inn.overs*6 - s.legalBalls;
    chase=`<div class="small" style="margin-top:4px">Target <b>${target}</b> · need <b>${need}</b> off <b>${ballsLeft}</b> balls</div>`;
  }
  const st=(s.striker && s.bat[s.striker]) || { name: '—', runs: 0, balls: 0 };
  const nst=(s.nonStriker && s.bat[s.nonStriker]) || { name: '—', runs: 0, balls: 0 };
  const bw=s.curBowler? s.bowl[s.curBowler]:null;
  return `<div class="card">
    <div class="small muted">${esc(m.teams.A.name)} vs ${esc(m.teams.B.name)} · ${esc(m.venue||'')} · ${esc(m.date||'')}
      ${m.status==='live'?'<span class="pill live">● LIVE</span>':''}</div>
    <div class="sb-top">
      <span class="bignum">${s.total}/${s.wickets}</span>
      <span class="muted">(${oversStr(s.legalBalls)}/${inn.overs} ov)</span>
      <span class="muted small">${esc(battingName)} · RR ${rr(s.total,s.legalBalls)}</span>
    </div>${chase}
    <div class="small" style="margin-top:8px; display:flex; gap:16px; flex-wrap:wrap">
      <span class="${'striker'}">${esc(st.name)} ${st.runs} (${st.balls})</span>
      <span>${esc(nst.name)} ${nst.runs} (${nst.balls})</span>
      ${bw?`<span class="muted">🎳 ${esc(bw.name)} ${oversStr(bw.balls)}-${bw.runs}-${bw.wkts}</span>`:''}
    </div>
    <div class="ball-timeline">${s.timeline.slice(-12).map(b=>`<span class="b ${b.cls}">${b.t}</span>`).join('')}</div>
  </div>`;
}

/* ---------- scoring controls (scorer, live) ---------- */
function scoringControls(m,inn,s){
  const need = s.ballInOver===0; // need bowler for the new over
  const pend = localBowler[m.id];
  if(need && !pend){
    // choose bowler for the over
    const opts=m.teams[inn.bowling].players
      .filter(p=> p.id!==s.lastOverBowler) // no consecutive overs
      .map(p=>`<div class="chip" onclick="pickBowler('${m.id}','${p.id}')">${esc(p.name)}</div>`).join('');
    return `<div class="card"><b>Over ${Math.floor(s.legalBalls/6)+1} — select bowler</b>
      <div class="chips">${opts}</div>
      ${s.lastOverBowler?`<div class="small muted" style="margin-top:6px">${esc(pName(m,s.lastOverBowler))} bowled the last over.</div>`:''}
    </div>`;
  }
  const bowler = pend || s.curBowler;
  return `<div class="card">
    <div class="small muted" style="margin-bottom:8px">Bowling: <b>${esc(pName(m,bowler))}</b>
      <button class="btn sm ghost" style="float:right" onclick="changeBowler('${m.id}')">change</button></div>
    <div class="grid6">
      <button class="scorebtn zero" onclick="ball('${m.id}',0)">0</button>
      <button class="scorebtn" onclick="ball('${m.id}',1)">1</button>
      <button class="scorebtn" onclick="ball('${m.id}',2)">2</button>
      <button class="scorebtn" onclick="ball('${m.id}',3)">3</button>
      <button class="scorebtn four" onclick="ball('${m.id}',4)">4</button>
      <button class="scorebtn six" onclick="ball('${m.id}',6)">6</button>
    </div>
    <div class="extras">
      <button class="btn" onclick="extra('${m.id}','wide')">Wide</button>
      <button class="btn" onclick="extra('${m.id}','noball')">No-ball</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn danger" onclick="wicketModal('${m.id}')">OUT</button>
      <button class="btn ghost" onclick="undo('${m.id}')">↶ Undo</button>
    </div>
    <div class="center" style="margin-top:12px">
      <button class="btn sm ghost" onclick="endMatchModal('${m.id}')">⚑ End match early</button>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
async function withMatch(id, fn){
  const doc=await COL().doc(id).get();
  if(!doc.exists) return;
  const m=doc.data();
  await fn(m);
}
function pickBowler(id,name){ localBowler[id]=name; COL().doc(id).get().then(d=>drawMatch(d.data())); }
function changeBowler(id){ localBowler[id]=null; COL().doc(id).get().then(d=>drawMatch(d.data())); }

async function ball(id, runs){
  await withMatch(id, async m=>{
    const inn=m.innings[m.currentInnings];
    const s=derive(m,inn);
    const bowler = (s.ballInOver===0? localBowler[id] : s.curBowler);
    if(!bowler){ toast('Select a bowler first'); return; }
    inn.deliveries.push({bowler, runs, extra:null, wicket:null, newBatsman:null});
    // clear pending bowler once the ball is recorded
    localBowler[id]=null;
    await saveMatch(m);
  });
}
async function extra(id, kind){
  if(kind==='noball'){
    return promptRuns(id, runs=>pushExtra(id,'noball',runs));
  }
  pushExtra(id,'wide',0);
}
async function pushExtra(id, kind, runs){
  await withMatch(id, async m=>{
    const inn=m.innings[m.currentInnings];
    const s=derive(m,inn);
    const bowler=(s.ballInOver===0? localBowler[id]: s.curBowler);
    if(!bowler){ toast('Select a bowler first'); return; }
    inn.deliveries.push({bowler, runs:runs||0, extra:kind, wicket:null, newBatsman:null});
    await saveMatch(m);
  });
}
async function undo(id){
  await withMatch(id, async m=>{
    const inn=m.innings[m.currentInnings];
    if(!inn.deliveries.length){ toast('Nothing to undo'); return; }
    inn.deliveries.pop();
    localBowler[id]=null;
    await saveMatch(m);
    toast('Undone');
  });
}

function promptRuns(id, cb){
  $('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <h3 style="margin-top:0">Runs off the no-ball (bat)</h3>
    <div class="chips">${[0,1,2,3,4,6].map(r=>`<div class="chip" onclick="__runcb(${r})">${r}</div>`).join('')}</div>
  </div></div>`;
  window.__runcb=(r)=>{ closeModal(); cb(r); };
}

/* ---------- wicket ---------- */
function wicketModal(id){
  COL().doc(id).get().then(doc=>{
    const m=doc.data(); const inn=m.innings[m.currentInnings]; const s=derive(m,inn);
    const bowler=(s.ballInOver===0? localBowler[id]: s.curBowler);
    if(!bowler){ toast('Select a bowler first'); return; }
    const fielders=m.teams[inn.bowling].players; // [{id,name}]
    const w={type:'bowled', out:'striker', catcher:null};
    const types=['bowled','caught','lbw','run out','stumped','retired hurt','retired out'];
    // available = not currently at crease and not dismissed; retired-hurt batters CAN return (shown with ↩)
    const availBatsmen=m.teams[inn.batting].players.filter(p=>{
      if(p.id===s.striker||p.id===s.nonStriker) return false;
      const b=s.bat[p.id]; return !(b&&b.out);
    });
    const render=()=>{
      $('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
        <h3 style="margin-top:0">Wicket / Retired 🏏</h3>
        <label>Dismissal / Action</label>
        <div class="chips" id="wtype">${types.map(t=>`<div class="chip ${w.type===t?'sel':''}" onclick="__wset('type','${t}')">${t}</div>`).join('')}</div>
        <label>Who is leaving?</label>
        <div class="chips">
          <div class="chip ${w.out==='striker'?'sel':''}" onclick="__wset('out','striker')">${esc(pName(m,s.striker))} (striker)</div>
          <div class="chip ${w.out==='nonstriker'?'sel':''}" onclick="__wset('out','nonstriker')">${esc(pName(m,s.nonStriker))} (non-striker)</div>
        </div>
        ${w.type==='caught'?`<label>Caught by</label><div class="chips">${fielders.map(f=>`<div class="chip ${w.catcher===f.id?'sel':''}" onclick="__wset('catcher','${f.id}')">${esc(f.name)}</div>`).join('')}</div>`:''}
        <label>New batsman ${availBatsmen.length?'':'<span class="small" style="color:var(--warn)">(nobody left — confirm to end the innings)</span>'}</label>
        <div class="chips">${availBatsmen.map(p=>{const ret=s.bat[p.id]&&s.bat[p.id].retired; return `<div class="chip ${w.newBatsman===p.id?'sel':''}" onclick="__wset('newBatsman','${p.id}')">${esc(p.name)}${ret?' ↩':''}</div>`;}).join('')}</div>
        <label>Runs completed this ball (usually 0)</label>
        <div class="chips">${[0,1,2,3].map(r=>`<div class="chip ${(w.runs||0)===r?'sel':''}" onclick="__wset('runs',${r})">${r}</div>`).join('')}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn danger" onclick="__wconfirm()">Confirm wicket</button>
        </div>
      </div></div>`;
    };
    window.__wset=(k,v)=>{ w[k]=v; if(k==='type'&&v!=='caught') w.catcher=null; render(); };
    window.__wconfirm=async()=>{
      if(w.type==='caught' && !w.catcher){ toast('Pick the catcher'); return; }
      if(!w.newBatsman && availBatsmen.length){ toast('Pick the new batsman'); return; }
      closeModal();
      inn.deliveries.push({bowler, runs:w.runs||0, extra:null,
        wicket:{type:w.type, out:w.out, catcher:w.catcher}, newBatsman:w.newBatsman||null});
      localBowler[id]=null;
      await saveMatch(m);
    };
    render();
  });
}

/* ---------- become the scorer (no PIN) ---------- */
function unlock(id){
  SCORER[id]=true;
  COL().doc(id).get().then(doc=>{ if(doc.exists) drawMatch(doc.data()); });
}

/* ---------- innings setup ---------- */
function drawInningsSetup(m){
  const n=m.currentInnings;
  // default batting: innings 0 -> Team A; innings 1 -> whoever didn't bat first
  let defBat='A';
  if(n===1){ defBat = m.innings[0].batting==='A'?'B':'A'; }
  const inn = m.innings[n] || {batting:defBat};
  const bat = inn.batting || defBat;
  const bowl = bat==='A'?'B':'A';
  const batP=m.teams[bat].players, bowlP=m.teams[bowl].players;
  const first = n===1? derive(m,m.innings[0]) : null;
  app.innerHTML=`<div class="card">
    <h2 style="margin-top:0">${n===0?'1st':'2nd'} Innings setup</h2>
    ${first?`<p class="result">${esc(m.teams[m.innings[0].batting].name)} scored ${first.total}/${first.wickets}. Target ${first.total+1}.</p>`:''}
    <label>Batting team</label>
    <select id="batTeam" onchange="__reSetup('${m.id}',this.value)">
      <option value="A" ${bat==='A'?'selected':''}>${esc(m.teams.A.name)}</option>
      <option value="B" ${bat==='B'?'selected':''}>${esc(m.teams.B.name)}</option>
    </select>
    <label>Overs</label><input id="innOvers" type="number" value="${m.oversPerInnings}" min="1">
    <label>Striker</label><select id="striker">${batP.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <label>Non-striker</label><select id="nonstriker">${batP.map((p,i)=>`<option value="${p.id}" ${i===1?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label>Opening bowler (${esc(m.teams[bowl].name)})</label><select id="obowler">${bowlP.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="startInnings('${m.id}')">Start innings ▶</button>
  </div>${historyLink(m)}`;
}
async function __reSetup(id, batTeam){
  await withMatch(id, async m=>{
    m.innings[m.currentInnings]={batting:batTeam}; // temp
    // don't save; just redraw
    drawInningsSetup(m);
  });
}
async function startInnings(id){
  const bat=$('batTeam').value, bowl=bat==='A'?'B':'A';
  const striker=$('striker').value, nonstriker=$('nonstriker').value;
  if(striker===nonstriker){ toast('Striker and non-striker must differ'); return; }
  await withMatch(id, async m=>{
    const inn={ batting:bat, bowling:bowl, overs:Math.max(1,parseInt($('innOvers').value)||m.oversPerInnings),
      strikerInit:striker, nonStrikerInit:nonstriker, deliveries:[], closed:false };
    m.innings[m.currentInnings]=inn;
    localBowler[id]=$('obowler').value; // opening bowler
    m.status='live';
    await saveMatch(m);
  });
}

/* ---------- innings break / summary transitions ---------- */
function drawInningsBreak(m,inn,s,header){
  const isFirst = m.currentInnings===0;
  app.innerHTML = header + `<div class="card center">
    <h3>Innings complete</h3>
    <p class="result">${esc(m.teams[inn.batting].name)} ${s.total}/${s.wickets} (${oversStr(s.legalBalls)} ov)</p>
    ${isFirst?
      `<button class="btn primary" onclick="startSecond('${m.id}')">Start 2nd innings ▶</button>`:
      `<button class="btn primary" onclick="finishMatch('${m.id}')">Finish match & see result 🏆</button>`}
  </div>` + scorecardHTML(m,inn,s) + historyLink(m);
}
async function startSecond(id){
  await withMatch(id, async m=>{
    // ensure first innings closed
    m.innings[0].closed=true;
    m.currentInnings=1;
    m.status='setup'; // triggers innings setup for scorer
    await saveMatch(m);
  });
}
// Compute a result string from whatever's been played so far.
function matchResult(m){
  const i0=m.innings[0]; if(!i0) return 'Match ended early';
  const a=derive(m,i0); const i1=m.innings[1];
  if(!i1){ return `Match ended early — ${m.teams[i0.batting].name} ${a.total}/${a.wickets}`; }
  const b=derive(m,i1); const t1=a.total, t2=b.total;
  const n1=m.teams[i0.batting].name, n2=m.teams[i1.batting].name;
  if(t2>t1){ const wl=(m.teams[i1.batting].players.length-1)-b.wickets; return `${n2} won by ${wl} wicket${wl!==1?'s':''}`; }
  if(t1>t2){ return `${n1} won by ${t1-t2} run${t1-t2!==1?'s':''}`; }
  return 'Match tied';
}
async function finishMatch(id){
  await withMatch(id, async m=>{
    m.innings[1].closed=true;
    m.result=matchResult(m); m.status='done';
    await saveMatch(m);
  });
}
// End a match early (abandon / stop mid-innings) — scorer only.
function endMatchModal(id){
  COL().doc(id).get().then(doc=>{
    if(!doc.exists) return;
    const m=doc.data();
    const isFirst = m.currentInnings===0;
    $('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
      <h3 style="margin-top:0">End match or innings early?</h3>
      <p class="muted">${isFirst?'You can end the 1st innings now to start the 2nd innings, or end the entire match.':'This will finish the match with current scores.'}</p>
      <div class="column" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        ${isFirst?`<button class="btn primary" onclick="__endInningsEarlyOk('${id}')">End 1st Innings ▶</button>`:''}
        <button class="btn danger" onclick="__endMatchOk('${id}')">End match completely ⚑</button>
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
      </div></div></div>`;
  });
}
async function __endInningsEarlyOk(id){
  closeModal();
  await withMatch(id, async m=>{
    const cur=m.innings[m.currentInnings]; if(cur) cur.closed=true;
    await saveMatch(m);
    toast('1st Innings ended');
  });
}
async function __endMatchOk(id){
  closeModal();
  await withMatch(id, async m=>{
    const cur=m.innings[m.currentInnings]; if(cur) cur.closed=true;
    m.result=matchResult(m); m.status='done';
    await saveMatch(m);
    toast('Match ended');
  });
}

function drawSummary(m){
  const a=m.innings[0], b=m.innings[1];
  const sa=derive(m,a), sb=b?derive(m,b):null;
  const canScore = SCORER[m.id];
  app.innerHTML=`<div class="card center">
    <div class="small muted">${esc(m.venue||'')} · ${esc(m.date||'')}</div>
    <h2 style="margin:6px 0">${esc(m.teams.A.name)} vs ${esc(m.teams.B.name)}</h2>
    <p class="result">🏆 ${esc(m.result||'')}</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn blue sm" onclick="exportCSV('${m.id}')">⬇ Export CSV (for Google Sheets)</button>
      ${!b && canScore ? `<button class="btn primary sm" onclick="startSecond('${m.id}')">▶ Start 2nd Innings</button>` : ''}
      ${!b && !canScore ? `<button class="btn ghost sm" onclick="unlock('${m.id}')">✍️ Score this match</button>` : ''}
    </div>
  </div>
  ${inningsCard(m,a,sa)}
  ${b?inningsCard(m,b,sb):''}
  ${historyLink(m)}`;
}
function inningsCard(m,inn,s){
  return `<div class="card"><h3 style="margin-top:0">${esc(m.teams[inn.batting].name)} — ${s.total}/${s.wickets} (${oversStr(s.legalBalls)} ov)</h3>
    ${scorecardTables(m,inn,s)}</div>`;
}

/* ---------- live scorecard (compact) ---------- */
function scorecardHTML(m,inn,s){
  return `<div class="card"><h3 style="margin-top:0">Scorecard</h3>${scorecardTables(m,inn,s)}</div>`;
}
function howOutStr(m,b){
  if(!b.out) return b.retired ? 'retired not out' : 'not out';
  const o=b.out;
  if(o.type==='retired out') return 'retired out';
  if(o.type==='caught') return `c ${esc(pName(m,o.catcher)||'?')} b ${esc(pName(m,o.bowler))}`;
  if(o.type==='bowled') return `b ${esc(pName(m,o.bowler))}`;
  if(o.type==='lbw') return `lbw b ${esc(pName(m,o.bowler))}`;
  if(o.type==='stumped') return `st b ${esc(pName(m,o.bowler))}`;
  if(o.type==='run out') return `run out`;
  return esc(o.type);
}
function scorecardTables(m,inn,s){
  const seen=new Set();
  // preserve batting appearance order (ids)
  const order=[]; const add=n=>{ if(n&&!seen.has(n)){ seen.add(n); order.push(n);} };
  add(inn.strikerInit); add(inn.nonStrikerInit);
  inn.deliveries.forEach(d=>{ if(d.newBatsman) add(d.newBatsman); });
  Object.keys(s.bat).forEach(add);
  const batRows=order.filter(n=>s.bat[n]).map(n=>{
    const b=s.bat[n]; const atCrease=(n===s.striker||n===s.nonStriker)&&!b.out&&!s.complete;
    const sr=b.balls? (b.runs/b.balls*100).toFixed(0):'-';
    return `<tr><td class="${n===s.striker&&atCrease?'striker':''}">${esc(b.name)} ${atCrease?'<span class="muted small">(batting)</span>':''}<div class="small muted">${howOutStr(m,b)}</div></td>
      <td class="n">${b.runs}</td><td class="n">${b.balls}</td><td class="n">${b.fours}</td><td class="n">${b.sixes}</td><td class="n">${sr}</td></tr>`;
  }).join('');
  const bowlRows=Object.values(s.bowl).map(b=>{
    const econ=b.balls? (b.runs/(b.balls/6)).toFixed(1):'-';
    return `<tr><td>${esc(b.name)}</td><td class="n">${oversStr(b.balls)}</td><td class="n">${b.runs}</td><td class="n">${b.wkts}</td><td class="n">${econ}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>Batsman</th><th class="n">R</th><th class="n">B</th><th class="n">4s</th><th class="n">6s</th><th class="n">SR</th></tr></thead>
    <tbody>${batRows}</tbody></table>
    <div class="small muted" style="margin:6px 0">Extras ${s.extrasTotal} · Total ${s.total}/${s.wickets}</div>
    <table style="margin-top:8px"><thead><tr><th>Bowler</th><th class="n">O</th><th class="n">R</th><th class="n">W</th><th class="n">Econ</th></tr></thead>
    <tbody>${bowlRows}</tbody></table>`;
}

function drawWaiting(m){
  app.innerHTML=`<div class="card">
    <div class="small muted">${esc(m.venue||'')} · ${esc(m.date||'')}</div>
    <h2>${esc(m.teams.A.name)} vs ${esc(m.teams.B.name)}</h2>
    <p class="muted">Match not started yet. Waiting for the scorer to set up the innings.</p>
    <button class="btn blue" onclick="unlock('${m.id}')">✍️ I'm the scorer</button>
  </div>${historyLink(m)}`;
}

/* ---------- CSV export ---------- */
function exportCSV(id){
  COL().doc(id).get().then(doc=>{
    const m=doc.data();
    let csv=[];
    csv.push(['Match',`${m.teams.A.name} vs ${m.teams.B.name}`]);
    csv.push(['Venue',m.venue]); csv.push(['Date',m.date]); csv.push(['Result',m.result||'']);
    csv.push([]);
    m.innings.forEach((inn,idx)=>{
      const s=derive(m,inn);
      csv.push([`Innings ${idx+1}: ${m.teams[inn.batting].name}`, `${s.total}/${s.wickets}`, `${oversStr(s.legalBalls)} ov`]);
      csv.push(['Batsman','R','B','4s','6s','Dismissal']);
      Object.values(s.bat).forEach(b=>csv.push([b.name,b.runs,b.balls,b.fours,b.sixes,howOutStrPlain(m,b)]));
      csv.push(['Bowler','O','R','W']);
      Object.values(s.bowl).forEach(b=>csv.push([b.name,oversStr(b.balls),b.runs,b.wkts]));
      csv.push([]);
      csv.push(['Ball-by-ball']); csv.push(['Over.Ball','Bowler','Runs','Extra','Wicket']);
      let lb=0;
      inn.deliveries.forEach(d=>{
        const legal=!(d.extra==='wide'||d.extra==='noball');
        if(legal) lb++;
        csv.push([oversStr(legal?lb:lb)+(legal?'':'*'),pName(m,d.bowler),d.runs||0,d.extra||'',d.wicket?d.wicket.type:'']);
      });
      csv.push([]);
    });
    const text=csv.map(r=>r.map(c=>{const v=(c==null?'':String(c)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
    const blob=new Blob([text],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`${m.teams.A.name}_vs_${m.teams.B.name}_${m.date}.csv`.replace(/\s+/g,'_');
    a.click();
  });
}
function howOutStrPlain(m,b){
  if(!b.out) return b.retired ? 'retired not out' : 'not out';
  const o=b.out;
  if(o.type==='retired out') return 'retired out';
  if(o.type==='caught') return `c ${pName(m,o.catcher)||'?'} b ${pName(m,o.bowler)}`;
  if(o.type==='bowled') return `b ${pName(m,o.bowler)}`;
  if(o.type==='lbw') return `lbw b ${pName(m,o.bowler)}`;
  if(o.type==='stumped') return `st b ${pName(m,o.bowler)}`;
  return o.type;
}

/* ============================ Dynamic retro backdrop ============================
   On each page load, pull random cricket photos (cricketers, grounds, World Cup
   moments, crowds) from Wikimedia Commons and splatter them like clippings.
   Dravid & Chappell are bundled locally and always included.
=================================================================================== */
// amazing grounds — big & in colour
const GROUND_QUERIES=[
  'Lord\'s Cricket Ground','Melbourne Cricket Ground','Eden Gardens Kolkata',
  'Wankhede Stadium','The Oval cricket London','Sydney Cricket Ground','cricket stadium'
];
// vintage cricketers, great bowlers, great Indian batsmen — big & sepia
const PLAYER_QUERIES=[
  'Don Bradman','Garfield Sobers','Vivian Richards cricketer','Sunil Gavaskar','Sachin Tendulkar',
  'Kapil Dev cricket','Wasim Akram','Shane Warne cricket','Malcolm Marshall cricket','Anil Kumble',
  'Glenn McGrath cricket','Brian Lara','Virat Kohli','Muttiah Muralitharan'
];
// world-cup-winning moments — medium & sepia
const MOMENT_QUERIES=[
  'Cricket World Cup celebration trophy','India 2011 Cricket World Cup','cricket world cup final',
  'West Indies 1975 Cricket World Cup','cricket team celebration'
];
let BG_IMAGES=[]; // fetched pool, shared by ambient collage + home gallery
let DRAVID_PICS=['assets/dravid.jpg']; // several Dravid photos; the frame cycles through them
let dravidIdx=0, dravidTimer=null;
function bgShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startDravidRotator(){
  if(dravidTimer) clearInterval(dravidTimer);
  if(DRAVID_PICS.length<2) return;
  dravidTimer=setInterval(()=>{
    const imgs=document.querySelectorAll('img.dravid'); if(!imgs.length) return;
    dravidIdx=(dravidIdx+1)%DRAVID_PICS.length;
    const next=DRAVID_PICS[dravidIdx];
    const pre=new Image();
    pre.onload=()=>imgs.forEach(im=>{ im.style.opacity='0'; setTimeout(()=>{ im.src=next; im.style.opacity=''; }, 450); });
    pre.src=next;
  }, 5000);
}
let tileTimer=null;
function startTileRotator(){
  if(tileTimer) clearInterval(tileTimer);
  const pool=BG_IMAGES.filter(x=>!x.dravid);
  if(pool.length<2) return;
  tileTimer=setInterval(()=>{
    const tiles=[...document.querySelectorAll('#gallery .ph img:not(.dravid)')];
    if(!tiles.length) return;
    const img=tiles[Math.floor(Math.random()*tiles.length)];          // one random non-Dravid tile
    const shown=new Set(tiles.map(t=>t.src));
    const choices=pool.filter(it=>!shown.has(it.url));
    const next=(choices.length?choices:pool)[Math.floor(Math.random()*((choices.length?choices:pool).length))];
    const pre=new Image();
    pre.onload=()=>{ img.style.opacity='0'; setTimeout(()=>{ img.src=next.url; img.classList.toggle('ground', !!next.ground); img.style.opacity=''; }, 450); };
    pre.src=next.url;
  }, 4000);
}
function fillGallery(){
  const g=document.getElementById('gallery'); if(!g) return;
  if(!BG_IMAGES.length){ g.innerHTML='<span class="small muted">Loading photos…</span>'; return; }
  const frameClasses=['hero','wide','tall','','pano','wide','tall','','wide','','hero',''];
  // always lead with a rotating Dravid hero, then the rest
  const dravid=BG_IMAGES.find(x=>x.dravid) || {url:DRAVID_PICS[0], dravid:true};
  const rest=bgShuffle(BG_IMAGES.filter(x=>!x.dravid)).slice(0,11);
  const shots=[dravid, ...rest];
  g.innerHTML=shots.map((it,i)=>{
    const frame = it.dravid ? 'hero' : frameClasses[i%frameClasses.length];
    const cls = (it.dravid?'dravid ':'') + (it.ground?'ground':'');
    return `<div class="ph ${frame}"><img loading="lazy" class="${cls.trim()}" src="${it.url}" onerror="this.closest('.ph').remove()"></div>`;
  }).join('');
  startDravidRotator();
  startTileRotator();
}
async function commonsSearch(term,n){
  const api='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
    +'&generator=search&gsrnamespace=6&gsrlimit='+n
    +'&gsrsearch='+encodeURIComponent('filetype:bitmap '+term)
    +'&prop=imageinfo&iiprop=url|mediatype&iiurlwidth=460';
  const r=await fetch(api); if(!r.ok) throw new Error('bad'); const j=await r.json();
  const pages=(j.query&&j.query.pages)||{};
  return Object.values(pages).map(p=>p.imageinfo&&p.imageinfo[0]).filter(Boolean)
    .filter(ii=>ii.mediatype==='BITMAP' && /\.jpe?g$/i.test(ii.url||''))
    .map(ii=>ii.thumburl).filter(Boolean);
}
// Openverse = Creative-Commons image search (Flickr, Commons, etc). Free to embed.
// Anonymous requests are capped at page_size 20, so clamp and allow paging.
async function openverseSearch(term,n,page){
  const ps=Math.min(20, n||20);
  const url='https://api.openverse.org/v1/images/?q='+encodeURIComponent(term)+'&page_size='+ps+'&page='+(page||1)+'&mature=false';
  const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok) throw new Error('ov');
  const j=await r.json(); if(!j.results) return [];
  return j.results.map(x=>x.url).filter(u=>/\.jpe?g$/i.test(u||''));
}
// fetch many pages (20 each) from Openverse
async function openverseAll(term, maxPages){
  const out=[];
  for(let p=1;p<=maxPages;p++){
    let batch=[]; try{ batch=await openverseSearch(term,20,p); }catch(e){ break; }
    if(!batch.length) break;
    out.push(...batch);
  }
  return out;
}
// pull a category from both Commons and Openverse and merge
async function bothSources(term,n){
  const [a,b]=await Promise.all([ commonsSearch(term,n).catch(()=>[]), openverseSearch(term,n).catch(()=>[]) ]);
  return [...a,...b];
}
function splatter(items){
  const bd=$('backdrop'); if(!bd) return; bd.innerHTML='';
  const W=window.innerWidth||360, H=window.innerHeight||640;
  // the readable content column is centred (<=640px); keep images out of it
  const colW=Math.min(640, W-24), colLeft=(W-colW)/2, colRight=colLeft+colW;
  // split across the two gutters, then stack one-per-band down each side (no overlap)
  const shuffled=bgShuffle(items);
  const sides={left:[], right:[]};
  shuffled.forEach((it,i)=> sides[i%2?'right':'left'].push(it));
  const topPad=74, gap=16;
  ['left','right'].forEach(side=>{
    const list=sides[side], n=list.length; if(!n) return;
    const bandH=(H-topPad-8)/n;
    list.forEach((it,k)=>{
      const img=new Image();
      const w=(it.ground?300:it.game?240:it.great?200:160)+Math.floor(Math.random()*(it.ground?120:80));
      let h=Math.round(w*(it.ground?0.62:0.8));
      h=Math.min(h, Math.max(64, Math.floor(bandH-gap)));   // never taller than its band -> no vertical overlap
      const left = side==='left' ? Math.round(colLeft - w + 22)   // bleed off the left edge
                                 : Math.round(colRight - 22);      // bleed off the right edge
      const top = Math.round(topPad + k*bandH + Math.max(0,(bandH-gap-h))/2);
      img.style.width=w+'px'; img.style.height=h+'px';
      img.style.left=left+'px'; img.style.top=top+'px';
      img.style.transform='rotate('+(Math.random()*14-7).toFixed(1)+'deg)';
      if(it.great) img.classList.add('great');
      if(it.ground) img.classList.add('ground');
      if(it.dravid) img.classList.add('dravid');
      img.onload=()=>img.classList.add('on');
      img.onerror=()=>img.remove();
      img.src=it.url;
      bd.appendChild(img);
    });
  });
  window.__bgItems=items; // remember for re-layout on resize/rotate
}
window.addEventListener('resize', ()=>{ if(window.__bgItems) splatter(window.__bgItems); });
async function loadBackdrop(){
  // pull as many distinct Dravid photos as the sources have, across several search terms
  try{
    const DRAVID_TERMS=['Rahul Dravid','Rahul Dravid cricket','Rahul Dravid batting',
      'Rahul Dravid India','Rahul Dravid coach','Rahul Dravid test match','Dravid The Wall'];
    const jobs=DRAVID_TERMS.map((t,i)=>openverseAll(t, i===0?5:2).catch(()=>[]));
    jobs.push(commonsSearch('Rahul Dravid',100).catch(()=>[]));
    const res=await Promise.all(jobs);
    const uniq=[...new Set([].concat(...res))];
    if(uniq.length) DRAVID_PICS=bgShuffle(uniq).slice(0,300); // however many exist
    console.log('Dravid photos loaded:', DRAVID_PICS.length);
  }catch(e){}
  // the greats are always around (Dravid rotates)
  const items=[{url:DRAVID_PICS[0],great:true,dravid:true},{url:'assets/chappell.jpg',great:true}];
  try{
    const gTerms=bgShuffle(GROUND_QUERIES).slice(0,2);
    const pTerms=bgShuffle(PLAYER_QUERIES).slice(0,3);
    const mTerms=bgShuffle(MOMENT_QUERIES).slice(0,2);
    const [grounds,players,moments]=await Promise.all([
      Promise.all(gTerms.map(t=>bothSources(t,4).catch(()=>[]))).then(r=>[].concat(...r)),
      Promise.all(pTerms.map(t=>bothSources(t,3).catch(()=>[]))).then(r=>[].concat(...r)),
      Promise.all(mTerms.map(t=>bothSources(t,4).catch(()=>[]))).then(r=>[].concat(...r)),
    ]);
    bgShuffle([...new Set(grounds)]).slice(0,3).forEach(u=>items.push({url:u, ground:true})); // colour, biggest
    bgShuffle([...new Set(players)]).slice(0,4).forEach(u=>items.push({url:u, game:true}));    // sepia, big
    bgShuffle([...new Set(moments)]).slice(0,3).forEach(u=>items.push({url:u}));               // sepia, medium
  }catch(e){}
  if(items.length<=2) items.push({url:'assets/sobers.jpg'}); // offline fallback
  BG_IMAGES=items;
  splatter(items);   // ambient side collage (wide screens)
  fillGallery();     // visible gallery under Leagues (all screens, esp. phones)
}
loadBackdrop();
</script>
