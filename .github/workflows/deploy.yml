name: Deploy to Firebase Hosting

# Auto-publishes to https://cricworldscores.web.app whenever main is updated.
# Contributors just open PRs; merging to main deploys — no Firebase access needed.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRICWORLDSCORES }}
          channelId: live
          projectId: cricworldscores
